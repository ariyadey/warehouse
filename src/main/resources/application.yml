spring:
  datasource:
    url: "jdbc:h2:tcp://localhost/~/test"
    username: "warehouse"
    password: "warehouse"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
logging:
  level:
    root: info
    ir:
      asta:
        training:
          testloglevel: info
    org:
      hibernate:
        type:
          descriptor:
            sql:
              BasicBinder: off
warehouse:
  search:
    default-page-size: 10
    default-page-number: 1